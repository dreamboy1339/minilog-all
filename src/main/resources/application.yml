spring:
  application:
    name: minilog-all
  datasource:
    url: jdbc:mysql://localhost:3306/minilog_all_db
    username: minilog_all_user
    password: dev_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

task:
  datasource:
    url: jdbc:mysql://localhost:3306/task_db
    username: minilog_all_user
    password: dev_password
    driver-class-name: com.mysql.cj.jdbc.Driver

quake:
  datasource:
    url: jdbc:mysql://localhost:3306/quake_db
    username: minilog_all_user
    password: dev_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  batch:
    interval-ms: 600000

crypto:
  datasource:
    url: jdbc:mysql://localhost:3306/crypto_db
    username: minilog_all_user
    password: dev_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  batch:
    interval-ms: 180000

jwt:
  secret: byTIXCO+3tgAnSveY9fRR+2M9FiuGfaCRo5Q1TiTm5U=

# 첨부파일 업로드 시 서버에 파일을 저장할 폴더 경로.
# 도커 환경에서는 이 경로에 볼륨을 마운트하고, APP_ATTACHMENT_DIR 환경변수로 재정의할 수 있다.
app:
  attachment:
    dir: ${APP_ATTACHMENT_DIR:attachment}
